<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Complete</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="success-page">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <span class="eyebrow">ALL SET!</span>

        <h1>
            You're registered.
        </h1>

        <p>
            Your event registration has been successfully
            submitted. Get ready for an amazing experience!
        </p>

        <div class="success-actions">

            <a href="/" class="primary-btn">
                Back to Home
            </a>

            <a href="/events" class="outline-dark-btn">
                Explore More Events
            </a>

        </div>

    </div>

</div>

</body>
</html>
